name: Skill CLI portability

on:
  push:
  pull_request:

jobs:
  skill-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Skill CLI tests
        run: >-
          node --test
          tests/json-parameter-files.test.mjs
          tests/gateway-mcp-clis.test.mjs
          tests/skill-script-audit.test.mjs
          tests/skill-version-consistency.test.mjs
